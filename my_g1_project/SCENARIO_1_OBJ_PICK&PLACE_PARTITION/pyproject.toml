[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1-cbf"
version = "0.1.0"
description = "Control-barrier-function safety filtering for Unitree G1 arm pick-and-place (MuJoCo + JAX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "mujoco>=3.2",
    "mujoco-mjx>=3.2",
    "jax",
    "proxsuite",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
g1-cbf = "g1_cbf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702"]
