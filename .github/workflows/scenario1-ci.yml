name: scenario1-ci

on:
  push:
    paths: ["my_g1_project/SCENARIO_1_OBJ_PICK&PLACE_PARTITION/**", ".github/workflows/scenario1-ci.yml"]
  pull_request:
    paths: ["my_g1_project/SCENARIO_1_OBJ_PICK&PLACE_PARTITION/**", ".github/workflows/scenario1-ci.yml"]

defaults:
  run:
    working-directory: my_g1_project/SCENARIO_1_OBJ_PICK&PLACE_PARTITION

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
